version: '3.8'

services:
  # Service Ollama pour gérer les LLMs (Llama 3.2, 3.1, etc.)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Configuration GPU pour Ollama (nécessite nvidia-container-toolkit sur l'hôte)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Service Radisson (ton moteur RAG)
  radisson-app:
    build: .
    container_name: radisson_engine
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATA_DIR=/app/data
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data

volumes:
  ollama_data: